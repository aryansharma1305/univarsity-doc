# Local development infrastructure for Docversity.
#
#   docker compose up -d --wait     start PostgreSQL, Redis and MinIO and wait until healthy
#   docker compose down             stop (data is kept in named volumes)
#   docker compose down -v          stop and DELETE all local data
#
# All ports are bound to 127.0.0.1 only and use non-default host ports so they never collide with a
# locally installed PostgreSQL (5432) or Redis (6379). Credentials are development-only defaults and
# can be overridden from the root .env file. Never reuse them anywhere else.

name: docversity

x-minio-image: &minio-image
  # MinIO no longer publishes community images to Docker Hub/Quay. This is Chainguard's maintained
  # build of MinIO from source (includes `mc`), pinned by digest for reproducibility.
  # See docs/decisions/ADR-0004-object-storage.md before changing it.
  image: cgr.dev/chainguard/minio@sha256:e7ca559d9f7c0b5f24f5f669bb92f40f3ca88d56273b808bf3a7c116c17d2ffa

services:
  postgres:
    image: postgres:17.11-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-docversity}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-docversity_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-docversity}
    ports:
      - '127.0.0.1:${POSTGRES_HOST_PORT:-55432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:-docversity_dev_redis}
      - --appendonly
      - 'yes'
    ports:
      - '127.0.0.1:${REDIS_HOST_PORT:-56379}:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -a "$$REDIS_PASSWORD" --no-auth-warning ping | grep -q PONG']
      interval: 5s
      timeout: 5s
      retries: 20
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-docversity_dev_redis}

  minio:
    <<: *minio-image
    restart: unless-stopped
    entrypoint: ['/bin/sh', '/docker/minio/entrypoint.sh']
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-docversity_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-docversity_dev_minio_admin}
      # `mc` alias used by the entrypoint/bootstrap and the healthcheck (root account, in-container only).
      MC_HOST_local: http://${MINIO_ROOT_USER:-docversity_admin}:${MINIO_ROOT_PASSWORD:-docversity_dev_minio_admin}@127.0.0.1:9000
      MC_CONFIG_DIR: /tmp/.mc
      # Bootstrap: private application bucket + least-privilege application user.
      S3_BUCKET: ${S3_BUCKET:-docversity-local}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-docversity_app}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-docversity_dev_app_secret}
    ports:
      - '127.0.0.1:${MINIO_API_HOST_PORT:-59000}:9000'
      - '127.0.0.1:${MINIO_CONSOLE_HOST_PORT:-59001}:9001'
    volumes:
      - minio-data:/data
      - ./docker/minio:/docker/minio:ro
    healthcheck:
      # Healthy = server ready AND bootstrap completed.
      test: ['CMD-SHELL', 'mc ready local >/dev/null 2>&1 && test -f /tmp/.docversity-initialised']
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

volumes:
  postgres-data:
  redis-data:
  minio-data:
