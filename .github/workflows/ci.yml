# Continuous integration — verification only. Nothing is deployed.
name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Install, lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up pnpm (version from package.json "packageManager")
        uses: pnpm/action-setup@v6

      - name: Set up Node.js (version from .nvmrc)
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Development defaults only — the same values docker-compose.yml uses. No secrets.
      - name: Create CI environment file
        run: cp .env.example .env

      - name: Start PostgreSQL, Redis and MinIO
        run: docker compose up -d --wait

      - name: Apply database migrations
        run: pnpm db:deploy

      - name: Database schema drift check (migrations vs schema.prisma)
        run: pnpm db:check

      - name: Synthetic Phase 7 to Phase 7B upgrade integrity
        run: node packages/database/scripts/verify-curriculum-upgrade.mjs

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Install Playwright browser
        run: pnpm --filter @docversity/web exec playwright install --with-deps chromium

      - name: Unit and integration tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Browser smoke test
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

      - name: Service logs
        if: failure()
        run: docker compose logs --no-color --tail=200

      - name: Stop services
        if: always()
        run: docker compose down -v

  staging:
    env:
      IMAGE_TAG: ${{ github.event.pull_request.head.sha || github.sha }}
    name: Local Docker staging and recovery rehearsal
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Generate isolated synthetic staging credentials
        run: python3 deploy/scripts/init-local.py
      - name: Assert private configuration
        run: |
          python3 deploy/scripts/check-config.py
          python3 deploy/scripts/test_staging.py
          python3 deploy/university/test_clean.py
          python3 deploy/coexist/test_coexist.py
          python3 deploy/coexist/test_benchmark.py
      - name: Reviewer gate fails closed (real Caddy startup configuration)
        run: python3 deploy/scripts/gate_regression.py
      - name: Shared proxy routes and reviewer authentication (offline pinned Caddy)
        run: python3 deploy/coexist/caddy_regression.py
      - name: Shared proxy HTTPS, network isolation, handoff and rollback (synthetic transport)
        run: python3 deploy/coexist/runtime_regression.py
      - name: Retain shared proxy transport evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: shared-proxy-transport-${{ env.IMAGE_TAG }}
          path: test-results/coexistence.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Render staging configuration (Phase 14C)
        run: |
          python3 deploy/render/check_render.py
          python3 deploy/render/test_render.py
      - name: Free runner SDK disk for the production image archive
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - name: Build production containers
        run: python3 deploy/scripts/staging.py build
      - name: Render edge and managed-database rehearsals (Phase 14C)
        env:
          RENDER_TOOLS_IMAGE: docversity14a-tools:${{ env.IMAGE_TAG }}
          RENDER_ECHO_IMAGE: docversity14a-web:${{ env.IMAGE_TAG }}
        run: |
          python3 deploy/render/edge_regression.py
          python3 deploy/render/roles_rehearsal.py
      - name: Start isolated gated production-mode staging
        run: |
          python3 deploy/scripts/staging.py review-init
          python3 deploy/scripts/staging.py up
      - name: Create synthetic accounts and verify trusted local HTTPS
        run: |
          python3 deploy/scripts/staging.py fixture
          docker compose -f deploy/compose.yml cp proxy:/data/caddy/pki/authorities/local/root.crt .local/staging/local-ca.crt
          chmod 644 .local/staging/local-ca.crt
          python3 deploy/scripts/staging.py smoke
      - name: Rehearse immutable image rollback and package the tested images
        run: python3 deploy/scripts/rehearse-release.py
      - name: Back up and restore only fresh synthetic volumes
        run: |
          python3 deploy/scripts/staging.py backup
          backup_name=$(find .local/backups -mindepth 1 -maxdepth 1 -type d -name '20*' -printf '%f\n' | sort | tail -1)
          python3 deploy/scripts/staging.py restore-test "$backup_name"
      - name: Retain verified release images and non-secret evidence
        uses: actions/upload-artifact@v7
        with:
          name: docversity-linux-amd64-${{ env.IMAGE_TAG }}
          path: |
            test-results/release/images.json
            test-results/release/rehearsal.json
            test-results/release/images.tar.gz
            test-results/release/SHA256SUMS
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - name: Local service health and resource consumption
        if: always()
        run: |
          docker compose -f deploy/compose.yml ps
          docker stats --no-stream
      - name: Stop synthetic CI services without touching other projects
        if: always()
        run: |
          docker compose -p docversity14a -f deploy/compose.yml stop
          docker compose -p docversity14a-restore -f deploy/compose.yml stop

  coexist-proxy-load:
    name: Shared proxy two-CPU benchmark and soak
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: CPU candidates, cold/warm tails, two-CPU contention and soak
        run: python3 deploy/coexist/runtime_regression.py --benchmark
      - name: Retain proxy benchmark evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: shared-proxy-benchmark-${{ github.event.pull_request.head.sha || github.sha }}
          path: test-results/coexist-benchmark.json
          if-no-files-found: ignore
          retention-days: 7

  coexist-load:
    name: Two-environment application load and rollback
    needs: staging
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      IMAGE_TAG: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/download-artifact@v7
        with:
          name: docversity-linux-amd64-${{ env.IMAGE_TAG }}
          path: .local/coexist-release
      - name: Verify and load only this run's exact-source AMD64 images
        id: release
        working-directory: .local/coexist-release
        run: |
          sha256sum -c SHA256SUMS
          docker load --input images.tar.gz
      - name: Fetch only pinned AMD64 test infrastructure
        run: |
          python3 - <<'PYTHON'
          import subprocess, sys
          sys.path.insert(0, 'deploy/university')
          import clean
          for image in clean.PINS.values():
              subprocess.run(['docker', 'pull', '--platform=linux/amd64', image], check=True)
          PYTHON
      - name: Fresh two-environment application load, isolation and rollback
        if: ${{ !cancelled() && steps.release.outcome == 'success' }}
        run: python3 deploy/coexist/full_stack.py --images .local/coexist-release/images.json
      - name: Retain aggregate performance and acceptance evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: shared-proxy-load-${{ env.IMAGE_TAG }}
          path: |
            test-results/coexist-benchmark.json
            test-results/coexist-full-stack.json
          if-no-files-found: ignore
          retention-days: 7
