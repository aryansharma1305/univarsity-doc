# Continuous integration — verification only. Nothing is deployed.
name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Install, lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm (version from package.json "packageManager")
        uses: pnpm/action-setup@v6

      - name: Set up Node.js (version from .nvmrc)
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Development defaults only — the same values docker-compose.yml uses. No secrets.
      - name: Create CI environment file
        run: cp .env.example .env

      - name: Start PostgreSQL, Redis and MinIO
        run: docker compose up -d --wait

      - name: Apply database migrations
        run: pnpm db:deploy

      - name: Database schema drift check (migrations vs schema.prisma)
        run: pnpm db:check

      - name: Synthetic Phase 7 to Phase 7B upgrade integrity
        run: node packages/database/scripts/verify-curriculum-upgrade.mjs

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit and integration tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Install Playwright browser
        run: pnpm --filter @docversity/web exec playwright install --with-deps chromium

      - name: Browser smoke test
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

      - name: Service logs
        if: failure()
        run: docker compose logs --no-color --tail=200

      - name: Stop services
        if: always()
        run: docker compose down -v
