# Docversity SSH hardening drop-in. Install as /etc/ssh/sshd_config.d/00-docversity-hardening.conf
# (0644 root:root). sshd keeps the FIRST value it reads for each keyword and includes
# sshd_config.d/*.conf in lexical order before the rest of sshd_config, so "00-" wins over
# 50-cloud-init.conf (which sets PasswordAuthentication yes and may be rewritten by cloud-init).
# Apply only through deploy/ops/ssh/RUNBOOK.md (gates G1-G5). Rollback: delete this file, sshd -t,
# systemctl reload ssh.

# Keys only. 1,692 failed password attempts and 0 accepted passwords in 7 days (2026-11-19).
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitEmptyPasswords no
PubkeyAuthentication yes
AuthenticationMethods publickey

# Phase A: root by key only. The release/deploy scripts and the only installed key use root@.
# Phase B (separate approval, after the sudo user has run a full release): change to "no".
PermitRootLogin prohibit-password

# Smaller brute-force window; no GUI or agent forwarding is used on this server.
MaxAuthTries 3
LoginGraceTime 30
X11Forwarding no
AllowAgentForwarding no
